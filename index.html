<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI動画事業OS ポータル</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* ============================================================
       CSS Variables
    ============================================================ */
    :root {
      --color-bg: #101011;
      --color-surface: #171717;
      --color-surface-2: #1f1f20;
      --color-border: rgba(255, 255, 255, 0.08);
      --color-text: #f5f5f5;
      --color-text-muted: #888888;
      --color-primary: #4f98a3;
      --color-success: #6daa45;
      --color-error: #dd6974;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ============================================================
       Base Styles
    ============================================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: var(--space-6) var(--space-4);
    }
    a {
      text-decoration: none;
      color: inherit;
    }

    /* ============================================================
       Layout & Header
    ============================================================ */
    .app-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: var(--space-8);
      margin-top: 5vh;
      animation: fadeIn var(--transition) ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
      text-align: center;
    }
    .header-icon {
      font-size: 3rem;
      color: var(--color-primary);
      margin-bottom: var(--space-2);
    }
    .header-title {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    .header-subtitle {
      color: var(--color-text-muted);
      font-size: 1rem;
      max-width: 500px;
    }

    /* ============================================================
       Menu Grid
    ============================================================ */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-4);
    }
    @media (max-width: 600px) {
      .menu-grid {
        grid-template-columns: 1fr;
      }
    }

    .menu-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .menu-card:hover {
      background-color: var(--color-surface-2);
      border-color: var(--color-primary);
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    }
    .menu-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, transparent, transparent);
      transition: background var(--transition);
    }
    .menu-card:hover::before {
      background: linear-gradient(90deg, var(--color-primary), transparent);
    }

    .card-icon {
      font-size: 2rem;
      color: var(--color-text);
      transition: color var(--transition);
    }
    .menu-card:hover .card-icon {
      color: var(--color-primary);
    }
    
    .card-title {
      font-size: 1.25rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title .ph-caret-right {
      font-size: 1rem;
      color: var(--color-text-muted);
      transition: transform var(--transition);
    }
    .menu-card:hover .card-title .ph-caret-right {
      color: var(--color-primary);
      transform: translateX(4px);
    }
    
    .card-desc {
      color: var(--color-text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

  </style>
</head>
<body>
  
  <div class="app-container">
    <header class="header">
      <i class="ph ph-hexagon header-icon"></i>
      <h1 class="header-title">AI動画事業OS</h1>
      <p class="header-subtitle">動画事業の品質とチームの生産性を最大化するオペレーションシステム</p>
    </header>

    <div class="menu-grid">
      <!-- 1. 作業スタート -->
      <a href="start.html" class="menu-card">
        <i class="ph ph-rocket card-icon"></i>
        <div class="card-title">
          作業スタート
          <i class="ph ph-caret-right"></i>
        </div>
        <div class="card-desc">
          新しい動画制作のセッションを開始し、作業用URLを発行します。（作業者・制作者向け）
        </div>
      </a>

      <!-- 2. 運営・進捗確認 -->
      <a href="ops.html" class="menu-card">
        <i class="ph ph-compass card-icon"></i>
        <div class="card-title">
          運営・判断基準
          <i class="ph ph-caret-right"></i>
        </div>
        <div class="card-desc">
          プロジェクト全体の進捗確認やSOPの俯瞰、OSの思想マップ等を確認します。（運営者・リーダー向け）
        </div>
      </a>

      <!-- 3. 作業ログ・分析 -->
      <a href="log.html" class="menu-card">
        <i class="ph ph-chart-bar card-icon"></i>
        <div class="card-title">
          作業ログ・分析
          <i class="ph ph-caret-right"></i>
        </div>
        <div class="card-desc">
          完了したセッションのログを確認し、スプレッドシート用に出力します。（分析・改善担当者向け）
        </div>
      </a>

      <!-- 4. OS管理設定 -->
      <a href="admin.html" class="menu-card">
        <i class="ph ph-gear card-icon"></i>
        <div class="card-title">
          OS管理設定
          <i class="ph ph-caret-right"></i>
        </div>
        <div class="card-desc">
          各ステップで使用するツールリンクを登録・編集します。（設計者・システム管理者向け）
        </div>
      </a>
    </div>
  </div>

</body>
</html>
