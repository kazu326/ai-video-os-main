<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI動画事業OS 作業ウィザード</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    /* ============================================================
       CSS Variables
    ============================================================ */
    :root {
      --color-bg: #101011;
      --color-surface: #171717;
      --color-surface-2: #1f1f20;
      --color-border: rgba(255, 255, 255, 0.08);
      --color-text: #f5f5f5;
      --color-text-muted: #888888;
      --color-primary: #4f98a3;
      --color-success: #6daa45;
      --color-error: #dd6974;
      --color-warning: #f9a826;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ============================================================
       Base Styles
    ============================================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    button, input, textarea {
      font-family: inherit;
      font-size: 1rem;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      transition: all var(--transition);
    }
    a {
      color: var(--color-primary);
      text-decoration: none;
    }

    /* ============================================================
       Layout
    ============================================================ */
    .header {
      background-color: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-3) var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .project-info {
      display: flex;
      flex-direction: column;
    }
    .project-name {
      font-weight: bold;
      font-size: 0.9rem;
    }
    .session-meta {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      display: flex;
      gap: var(--space-2);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .btn-abort {
      font-size: 0.875rem;
      color: var(--color-error);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
    }
    .btn-abort:hover {
      background-color: rgba(221, 105, 116, 0.1);
      border-color: var(--color-error);
    }

    .main-container {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: var(--space-6) var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    /* ============================================================
       Step Header
    ============================================================ */
    .step-header {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .step-badge {
      align-self: flex-start;
      background-color: var(--color-surface-2);
      color: var(--color-primary);
      font-size: 0.875rem;
      font-weight: bold;
      padding: var(--space-1) var(--space-3);
      border-radius: 999px;
      border: 1px solid var(--color-border);
    }
    .step-title {
      font-size: 1.5rem;
      font-weight: bold;
      line-height: 1.3;
    }
    .step-meta {
      font-size: 0.875rem;
      color: var(--color-text-muted);
      display: flex;
      gap: var(--space-4);
    }
    .step-meta span {
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    /* ============================================================
       Brand DB Alert
    ============================================================ */
    .brand-alert {
      display: none;
      background-color: rgba(249, 168, 38, 0.1);
      border: 1px solid var(--color-warning);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      align-items: center;
      justify-content: space-between;
    }
    .brand-alert-text {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--color-warning);
      font-weight: bold;
      font-size: 0.9rem;
    }
    .btn-brand-db {
      background-color: var(--color-warning);
      color: #000;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: bold;
    }

    /* ============================================================
       Tool Links
    ============================================================ */
    .section-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: var(--space-3);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      border-bottom: 1px solid var(--color-border);
      padding-bottom: var(--space-2);
    }
    .tools-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-3);
    }
    .tool-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: inherit;
      transition: all var(--transition);
    }
    .tool-card:hover {
      background-color: var(--color-surface-2);
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }
    .tool-info {
      display: flex;
      flex-direction: column;
    }
    .tool-name {
      font-weight: bold;
      font-size: 1rem;
    }
    .tool-desc {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-top: 2px;
    }
    .tool-icon {
      color: var(--color-primary);
      font-size: 1.25rem;
    }
    .no-tools-msg {
      color: var(--color-text-muted);
      font-size: 0.875rem;
      text-align: center;
      padding: var(--space-4);
      background-color: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px dashed var(--color-border);
    }

    /* ============================================================
       Memo Area
    ============================================================ */
    .memo-area {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .memo-textarea {
      width: 100%;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: var(--space-3);
      border-radius: var(--radius-md);
      min-height: 100px;
      resize: vertical;
    }
    .memo-textarea:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    /* ============================================================
       Production Workspace (STEP 3-7)
    ============================================================ */
    .production-workspace {
      display: none;
      flex-direction: column;
      gap: var(--space-4);
    }
    .production-workspace.is-visible {
      display: flex;
    }
    .production-panel,
    .production-card {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .production-card {
      background-color: var(--color-surface-2);
    }
    .production-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-3);
    }
    .production-label {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      font-size: 0.8rem;
      color: var(--color-text-muted);
      font-weight: bold;
    }
    .production-input,
    .production-select,
    .production-textarea {
      width: 100%;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-sm);
    }
    .production-textarea {
      min-height: 88px;
      resize: vertical;
    }
    .production-input:focus,
    .production-select:focus,
    .production-textarea:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .production-actions,
    .production-tabs,
    .copy-actions {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      align-items: center;
    }
    .production-btn,
    .production-tab,
    .copy-btn {
      background-color: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--space-2) var(--space-3);
      font-size: 0.875rem;
      font-weight: bold;
    }
    .production-btn:hover,
    .production-tab:hover,
    .copy-btn:hover {
      border-color: var(--color-primary);
    }
    .production-btn:disabled,
    .copy-btn:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .production-btn.is-primary {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .production-btn.is-danger {
      color: var(--color-error);
    }
    .production-tab.is-active,
    .copy-btn.is-primary {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .production-note,
    .copy-feedback {
      color: var(--color-text-muted);
      font-size: 0.8rem;
    }
    .copy-feedback.is-success {
      color: var(--color-success);
    }
    .copy-feedback.is-error {
      color: var(--color-error);
    }
    .step4-asset-preview {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }
    .asset-status {
      color: var(--color-text-muted);
      font-size: 0.8rem;
    }
    .asset-status.is-success {
      color: var(--color-success);
    }
    .asset-status.is-error {
      color: var(--color-error);
    }
    .asset-status.is-warning {
      color: var(--color-warning);
    }
    .production-check {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 0.875rem;
      color: var(--color-text);
    }
    .readonly-block {
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      color: var(--color-text);
      padding: var(--space-3);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 0.9rem;
    }
    @media (min-width: 700px) {
      .production-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* ============================================================
       Footer / Actions
    ============================================================ */
    .footer-actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      padding-bottom: var(--space-6);
    }
    .btn-next {
      background-color: var(--color-primary);
      color: #fff;
      padding: var(--space-4);
      border-radius: var(--radius-md);
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--space-2);
      box-shadow: 0 4px 12px rgba(79, 152, 163, 0.2);
    }
    .btn-next:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .btn-next.is-finish {
      background-color: var(--color-success);
      box-shadow: 0 4px 12px rgba(109, 170, 69, 0.2);
    }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background-color: var(--color-surface);
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 10;
    }
    .progress-bar {
      height: 100%;
      background-color: var(--color-primary);
      width: 0%;
      transition: width 300ms ease;
    }

    /* ============================================================
       Modals
    ============================================================ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
      padding: var(--space-4);
    }
    .modal-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-content {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      transform: translateY(20px);
      transition: transform var(--transition);
    }
    .modal-overlay.is-open .modal-content {
      transform: translateY(0);
    }
    .modal-header {
      padding: var(--space-4);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .btn-close {
      font-size: 1.25rem;
      color: var(--color-text-muted);
    }
    .btn-close:hover {
      color: var(--color-text);
    }
    .modal-body {
      padding: var(--space-4);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    
    /* Brand DB specific */
    .brand-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .brand-section-title {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .brand-section-content {
      background-color: var(--color-surface-2);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      white-space: pre-wrap;
    }

  </style>
</head>
<body>
  
  <header class="header">
    <div class="header-left">
      <div id="media-icon" style="font-size: 1.5rem; color: var(--color-primary);"></div>
      <div class="project-info">
        <span class="project-name" id="display-project">プロジェクト名</span>
        <div class="session-meta">
          <span id="display-user">作業者</span> • <span id="display-level">熟練度</span>
        </div>
      </div>
    </div>
    <div class="header-right">
      <button id="btn-abort" class="btn-abort">途中終了</button>
    </div>
  </header>

  <main class="main-container">
    
    <div class="step-header">
      <div class="step-badge" id="step-badge">STEP 1 / 14</div>
      <h1 class="step-title" id="step-title">タイトル</h1>
      <div class="step-meta">
        <span><i class="ph ph-clock"></i> 目安: <span id="step-time">0</span>分</span>
        <span id="step-id-display" style="display:none;"></span>
      </div>
    </div>

    <div id="brand-alert" class="brand-alert">
      <div class="brand-alert-text">
        <i class="ph ph-warning-circle"></i> ブランド設定を確認してください
      </div>
      <button id="btn-show-brand" class="btn-brand-db">確認する</button>
    </div>

    <div class="tools-area">
      <h2 class="section-title"><i class="ph ph-wrench"></i> 使用ツール</h2>
      <div id="tools-container" class="tools-grid">
        <!-- Tools will be rendered here -->
      </div>
    </div>

    <div class="memo-area">
      <h2 class="section-title"><i class="ph ph-note-pencil"></i> 作業メモ・気づき</h2>
      <textarea id="step-memo" class="memo-textarea" placeholder="この工程での気づきや、次工程への申し送り事項があれば記入してください..."></textarea>
    </div>

    <div id="production-workspace" class="production-workspace">
      <!-- STEP 3-7 production UI will be rendered here -->
    </div>

    <div class="footer-actions">
      <button id="btn-next" class="btn-next">
        <span>完了して次へ</span> <i class="ph ph-arrow-right"></i>
      </button>
    </div>
  </main>

  <div class="progress-container">
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <!-- Brand DB Modal -->
  <div id="modal-brand" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title"><i class="ph ph-book-bookmark"></i> ブランド設定</div>
        <button class="btn-close" onclick="closeBrandModal()"><i class="ph ph-x"></i></button>
      </div>
      <div class="modal-body" id="brand-content">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script>
    const PRODUCTION_STORAGE_KEY = "aiVideoOsProductionState";
    const SUPABASE_URL = "https://adbitwieufbfczrfvkql.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_i9da9o6E7A9cN4uWS7gjHg_VUzSHPsT";
    const BRAND_SETTINGS_TABLE = "brand_settings";
    const BRAND_SETTINGS_PROJECT_KEY = "default";
    const TOOL_LINKS_TABLE = "tool_links";
    const TOOL_LINKS_PROJECT_KEY = "default";
    const PRODUCTION_STATES_TABLE = "production_states";
    const PRODUCTION_STATE_PROJECT_KEY = "default";
    const VIDEO_ASSETS_TABLE = "video_assets";
    const GAS_IMAGE_UPLOAD_URL = "https://script.google.com/macros/s/AKfycbxzFz23boOShS5xUacvepaGFyJe8Cve9ARu8Wl21bkpmY3DNCLKntT62a8Ifv60Eak8/exec";

    let brandSettingsSupabaseClient = null;
    let toolLinksSupabaseClient = null;
    let productionStateSupabaseClient = null;
    let videoAssetsSupabaseClient = null;

    // ============================================================
    // State Management
    // ============================================================
    const state = {
      user: '',
      project: '',
      media: '',
      level: '',
      targetSteps: [],     // 実行対象のSTEP情報配列
      currentIndex: 0,     // 現在のインデックス
      allToolLinks: [],    // localStorageからのツールリンク
      brandSettings: null,
      sessionLog: {
        id: crypto.randomUUID(),
        startTime: Date.now(),
        user: '',
        project: '',
        media: '',
        level: '',
        steps: [],         // 各STEPのログ
        status: 'active'   // active, completed, aborted
      },
      currentStepStartTime: 0
    };

    let productionState = createDefaultProductionState();
    let productionStateDirty = false;
    let productionStateHydrated = false;
    let productionStateSyncPending = false;
    let productionStateUpdatedAt = null;
    let productionStateSaveTimer = null;
    const productionUiState = {
      activeVideoByStep: {
        5: 0,
        6: 0,
        7: 0,
        8: 0
      },
      step4PreviewUrl: ""
    };

    // ============================================================
    // DOM Elements
    // ============================================================
    const els = {
      displayProject: document.getElementById('display-project'),
      displayUser: document.getElementById('display-user'),
      displayLevel: document.getElementById('display-level'),
      mediaIcon: document.getElementById('media-icon'),
      stepBadge: document.getElementById('step-badge'),
      stepTitle: document.getElementById('step-title'),
      stepTime: document.getElementById('step-time'),
      brandAlert: document.getElementById('brand-alert'),
      btnShowBrand: document.getElementById('btn-show-brand'),
      toolsContainer: document.getElementById('tools-container'),
      stepMemo: document.getElementById('step-memo'),
      productionWorkspace: document.getElementById('production-workspace'),
      btnNext: document.getElementById('btn-next'),
      btnAbort: document.getElementById('btn-abort'),
      progressBar: document.getElementById('progress-bar'),
      modalBrand: document.getElementById('modal-brand'),
      brandContent: document.getElementById('brand-content')
    };

    // ============================================================
    // Initialization & Parsing
    // ============================================================
    function init() {
      console.log("[wizard] Initializing...");
      
      // Parse URL parameters
      const params = new URLSearchParams(window.location.search);
      state.user = params.get('user') || 'Unknown User';
      state.project = params.get('project') || 'Unknown Project';
      state.media = params.get('media') || 'all';
      state.level = params.get('level') || 'all';
      
      // Setup session log meta
      state.sessionLog.user = state.user;
      state.sessionLog.project = state.project;
      state.sessionLog.media = state.media;
      state.sessionLog.level = state.level;

      // Parse steps range (e.g. "2-5")
      const stepsParam = params.get('steps') || '1-14';
      const [startStr, endStr] = stepsParam.split('-');
      const startId = parseInt(startStr, 10) || 1;
      const endId = parseInt(endStr, 10) || 14;

      // Filter STEPS from config.js
      state.targetSteps = STEPS.filter(s => s.id >= startId && s.id <= endId);
      if (state.targetSteps.length === 0) {
        alert("有効なSTEP範囲が指定されていません。");
        return;
      }

      // Load tool links from localStorage first, then refresh from Supabase.
      state.allToolLinks = loadToolLinksFromLocalStorage();
      state.brandSettings = normalizeBrandSettings(typeof getBrandSettings === 'function' ? getBrandSettings() : {});

      productionState = loadProductionState();
      saveProductionState({ sync: false, markDirty: false });

      // Setup Header UI
      els.displayProject.textContent = state.project;
      els.displayUser.textContent = state.user;
      
      const levelLabel = LEVELS[state.level] ? LEVELS[state.level].label : state.level;
      els.displayLevel.textContent = levelLabel;
      
      const mediaIconClass = MEDIA_TYPES[state.media]?.icon || 'ph-monitor';
      els.mediaIcon.innerHTML = `<i class="ph ${mediaIconClass}"></i>`;

      // Event Listeners
      els.btnNext.addEventListener('click', handleNextStep);
      els.btnAbort.addEventListener('click', handleAbort);
      els.btnShowBrand.addEventListener('click', openBrandModal);
      els.productionWorkspace.addEventListener('input', onProductionInput);
      els.productionWorkspace.addEventListener('change', onProductionChange);
      els.productionWorkspace.addEventListener('click', onProductionClick);

      // Start first step
      renderCurrentStep();
      hydrateProductionStateFromSupabase();
      hydrateBrandSettingsFromSupabase();
      hydrateToolLinksFromSupabase();
    }

    // ============================================================
    // Render
    // ============================================================
    function renderCurrentStep() {
      const step = state.targetSteps[state.currentIndex];
      state.currentStepStartTime = Date.now();
      els.stepMemo.value = ''; // Reset memo

      console.log(`[wizard] Rendering step ${step.id}: ${step.title}`);

      // Header info
      els.stepBadge.textContent = `STEP ${state.currentIndex + 1} / ${state.targetSteps.length}`;
      els.stepTitle.textContent = `${step.id}. ${step.title}`;
      els.stepTime.textContent = step.estimatedMinutes;

      // Progress bar
      const progressPercent = (state.currentIndex / state.targetSteps.length) * 100;
      els.progressBar.style.width = `${progressPercent}%`;

      // Brand Check
      if (step.hasBrandCheck) {
        els.brandAlert.style.display = 'flex';
        renderBrandContent();
      } else {
        els.brandAlert.style.display = 'none';
      }

      renderProductionWorkspace(step.id);

      // Tool Links Filter
      // Condition: 
      // 1. media matches (or tool is 'all')
      // 2. stepId matches
      // 3. level matches (or tool is 'all' / array includes)
      const stepTools = state.allToolLinks.filter(tool => {
        if (tool.stepId !== step.id) return false;
        if (tool.media !== 'all' && tool.media !== state.media) return false;
        
        // Handle allowedLevels (string 'all' or array)
        if (tool.allowedLevels !== 'all') {
           if (Array.isArray(tool.allowedLevels) && !tool.allowedLevels.includes(state.level) && state.level !== 'all') {
             return false;
           }
        }
        
        return true;
      });

      // Render Tools
      if (stepTools.length > 0) {
        // Sort by order
        stepTools.sort((a, b) => (a.order || 0) - (b.order || 0));
        
        els.toolsContainer.innerHTML = stepTools.map(tool => `
          <a href="${tool.url}" target="_blank" rel="noopener noreferrer" class="tool-card">
            <div class="tool-info">
              <span class="tool-name">${tool.name}</span>
              ${tool.description ? `<span class="tool-desc">${tool.description}</span>` : ''}
            </div>
            <div class="tool-icon"><i class="ph ph-arrow-square-out"></i></div>
          </a>
        `).join('');
      } else {
        els.toolsContainer.innerHTML = `
          <div class="no-tools-msg">
            この工程に登録されているツールはありません。<br>
            手動で作業を進めてください。
          </div>
        `;
      }

      // Button State
      if (state.currentIndex === state.targetSteps.length - 1) {
        els.btnNext.innerHTML = `<span>すべての作業を完了する</span> <i class="ph ph-check-circle"></i>`;
        els.btnNext.classList.add('is-finish');
      } else {
        els.btnNext.innerHTML = `<span>完了して次へ</span> <i class="ph ph-arrow-right"></i>`;
        els.btnNext.classList.remove('is-finish');
      }
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentStepTools() {

      if (!step) return;

      const stepTools = state.allToolLinks.filter(tool => {
        if (tool.enabled === false) return false;
        if (tool.stepId !== step.id) return false;
        if (tool.media !== 'all' && tool.media !== state.media) return false;

        if (tool.allowedLevels !== 'all') {
           if (Array.isArray(tool.allowedLevels) && !tool.allowedLevels.includes(state.level) && state.level !== 'all') {

        return true;

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    function formatBrandList(items) {
      return (items || []).map(item => escapeHTML(item)).filter(Boolean).join('<br>');
    }

    function normalizeBrandSettings(data = {}) {
      const fallback = typeof BRAND_DB_DEFAULT === 'object' ? BRAND_DB_DEFAULT : {};
      const source = { ...fallback, ...(data || {}) };
      return {
        accountName: source.accountName || source.account_name || '',
        concept: source.concept || source.worldview || '',
        target: source.target || '',
        toneAndManner: source.toneAndManner || source.tone_and_manner || source.temperature || source.tempo || '',
        ngWords: Array.isArray(source.ngWords) ? source.ngWords : (Array.isArray(source.ng_words) ? source.ng_words : []),
        checkPoints: Array.isArray(source.checkPoints) ? source.checkPoints : (Array.isArray(source.check_points) ? source.check_points : [])
      };
    }

    // ============================================================
    // Production State
    // ============================================================
    function createDefaultProductionState() {
      return {
        postingFrequency: 3,
        step4Asset: createDefaultStep4Asset(),
        characters: [],
        videos: [createDefaultVideo(1), createDefaultVideo(2), createDefaultVideo(3)],
        cutBatch: createDefaultCutBatch()
      };

    function createDefaultStep4Asset() {
      const lotId = buildDefaultLotId();
      const sortOrder = 1;
      return {
        lot_id: lotId,
        sort_order: sortOrder,
        video_id: buildStep4VideoId(lotId, sortOrder),

        status: "",
        last_error: ""
      };

    function createDefaultCutBatch() {

    }

    function createDefaultVideo(number) {
      return {
        video_id: `video_${number}`,

      const video = productionState.videos[videoIndex];
      const sceneNumber = video.scenes.length + 1;
      return {
        scene_id: `${video.video_id}_scene_${Date.now().toString(36)}`,
        scene_number: sceneNumber,

        scene_description_en: "",
        visual_prompt: "",
        dialogue: "",
        caption_dialogue: "",
        voice_dialogue: "",

        video_output_url: "",
        voice_output_url: "",

        is_voice_done: false
      };

    function createDefaultCutStatus() {
      return {
        videoPromptCopied: false,
        videoGenerated: false,
        voiceCopied: false,
        voiceGenerated: false,
        edited: false,
        voiceRegenerateNeeded: false
      };
    }

    function createDefaultCutNotes() {
      return {
        voiceRegenerateReason: "",
        editNote: ""
      };
    }

    function loadProductionState() {
      try {
        const raw = localStorage.getItem(PRODUCTION_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        return ensureProductionState(parsed);
      } catch (e) {
        console.error("[wizard] Failed to parse production state:", e);
        return createDefaultProductionState();
      }
    }

    function saveProductionState(options = {}) {
      const { sync = true, markDirty = true } = options;
      localStorage.setItem(PRODUCTION_STORAGE_KEY, JSON.stringify(productionState));
      if (markDirty) productionStateDirty = true;
      if (sync) scheduleProductionStateSave();
    }

    function ensureProductionState(value) {
      const next = createDefaultProductionState();
      if (value && typeof value === 'object') {
        next.postingFrequency = clampPostingFrequency(value.postingFrequency || next.postingFrequency);
        next.step4Asset = normalizeStep4Asset(value.step4Asset || value.step4_asset || next.step4Asset);
        next.characters = Array.isArray(value.characters) ? value.characters : [];
        if (Array.isArray(value.videos)) {
          value.videos.slice(0, 3).forEach((video, index) => {
            next.videos[index] = {
              ...createDefaultVideo(index + 1),
              ...video,
              video_id: `video_${index + 1}`,
              scenes: Array.isArray(video.scenes) ? video.scenes : []
            };
            next.videos[index].scenes.forEach((scene, sceneIndex) => {
              scene.scene_number = sceneIndex + 1;
            });
          });
        }
        next.cutBatch = normalizeCutBatch(value.cutBatch || value.batch || null, { allowEmpty: true });
      }
      return next;
    }

    function normalizeStep4Asset(value) {
      const fallback = createDefaultStep4Asset();
      const source = value && typeof value === 'object' ? value : {};
      const sortOrder = normalizeStep4SortOrder(source.sort_order ?? source.sortOrder ?? fallback.sort_order);
      const lotId = String(source.lot_id || source.lotId || fallback.lot_id).trim() || fallback.lot_id;
      const videoId = String(source.video_id || source.videoId || buildStep4VideoId(lotId, sortOrder)).trim();

      return {
        lot_id: lotId,
        sort_order: sortOrder,
        video_id: videoId || buildStep4VideoId(lotId, sortOrder),
        drive_file_id: String(source.drive_file_id || source.driveFileId || ""),
        drive_url: String(source.drive_url || source.driveUrl || ""),
        image_uploaded_at: String(source.image_uploaded_at || source.imageUploadedAt || ""),
        asset_json_text: String(source.asset_json_text || source.assetJsonText || ""),
        script_raw: String(source.script_raw || source.scriptRaw || ""),
        status: String(source.status || ""),
        last_error: String(source.last_error || source.lastError || "")
      };
    }

    function normalizeCutBatch(value, options = {}) {
      const { allowEmpty = false } = options;
      if (!value || typeof value !== 'object') return createDefaultCutBatch();

      const videos = Array.isArray(value.videos) ? value.videos : [];
      if (!allowEmpty && videos.length === 0) return createDefaultCutBatch();

      return {
        batchId: String(value.batchId || value.batch_id || ""),
        batchTitle: String(value.batchTitle || value.batch_title || ""),
        videos: videos.map((video, videoIndex) => normalizeCutBatchVideo(video, videoIndex))
      };
    }

    function normalizeCutBatchVideo(video, videoIndex) {
      const cuts = Array.isArray(video?.cuts) ? video.cuts : [];
      return {
        videoId: String(video?.videoId || video?.video_id || `video_${String(videoIndex + 1).padStart(2, '0')}`),
        videoTitle: String(video?.videoTitle || video?.video_title || `動画${videoIndex + 1}`),
        duration: Number(video?.duration) || 0,
        cuts: cuts.map((cut, cutIndex) => normalizeCut(cut, cutIndex))
      };
    }

    function normalizeCut(cut, cutIndex) {
      return {
        cutId: String(cut?.cutId || cut?.cut_id || `cut_${String(cutIndex + 1).padStart(2, '0')}`),
        timeRange: String(cut?.timeRange || cut?.time_range || ""),
        videoPrompt: String(cut?.videoPrompt || cut?.video_prompt || ""),
        line: String(cut?.line || ""),
        caption: String(cut?.caption || cut?.line || ""),
        status: {
          ...createDefaultCutStatus(),
          ...(cut?.status && typeof cut.status === 'object' ? cut.status : {})
        },
        notes: {
          ...createDefaultCutNotes(),
          ...(cut?.notes && typeof cut.notes === 'object' ? cut.notes : {})
        }
      };
    }

    function hasCutBatchData(cutBatch = productionState.cutBatch) {
      return Boolean(
        cutBatch &&
        Array.isArray(cutBatch.videos) &&
        cutBatch.videos.some(video => Array.isArray(video.cuts) && video.cuts.length > 0)
      );
    }

    function validateCutBatchImport(value) {
      const errors = [];
      if (!value || typeof value !== 'object') {
        return ["JSONのルートはオブジェクトにしてください。"];
      }
      if (!value.batchId) errors.push("batchId");
      if (!value.batchTitle) errors.push("batchTitle");
      if (!Array.isArray(value.videos) || value.videos.length === 0) {
        errors.push("videos（1件以上）");
        return errors;
      }

      value.videos.forEach((video, videoIndex) => {
        const videoPath = `videos[${videoIndex}]`;
        if (!video.videoId) errors.push(`${videoPath}.videoId`);
        if (!video.videoTitle) errors.push(`${videoPath}.videoTitle`);
        if (video.duration === undefined || video.duration === null) errors.push(`${videoPath}.duration`);
        if (!Array.isArray(video.cuts) || video.cuts.length === 0) {
          errors.push(`${videoPath}.cuts（1件以上）`);
          return;
        }
        video.cuts.forEach((cut, cutIndex) => {
          const cutPath = `${videoPath}.cuts[${cutIndex}]`;
          if (!cut.cutId) errors.push(`${cutPath}.cutId`);
          if (!cut.timeRange) errors.push(`${cutPath}.timeRange`);
          if (!cut.videoPrompt) errors.push(`${cutPath}.videoPrompt`);
          if (!cut.line) errors.push(`${cutPath}.line`);
        });
      });

      return errors;
    }

    function hasProductionStateData(value) {
      if (!value || typeof value !== 'object') return false;
      const stateValue = ensureProductionState(value);
      if (stateValue.postingFrequency !== 3) return true;
      if (hasStep4AssetData(stateValue.step4Asset)) return true;
      if (stateValue.characters.length > 0) return true;
      return stateValue.videos.some(video => {
        return Boolean(
          video.linked_character_id ||
          video.script_title ||
          video.hook ||
          video.full_dialogue ||
          video.caption_dialogue ||
          video.voice_dialogue ||
          video.scene_description_en ||
          video.visual_prompt ||
          video.memo ||
          (Array.isArray(video.scenes) && video.scenes.length > 0)
        );
      }) || hasCutBatchData(stateValue.cutBatch);
    }

    function hasStep4AssetData(asset) {
      if (!asset || typeof asset !== 'object') return false;
      const fallback = createDefaultStep4Asset();
      return Boolean(
        asset.drive_file_id ||
        asset.drive_url ||
        asset.image_uploaded_at ||
        asset.asset_json_text ||
        asset.script_raw ||
        asset.status ||
        asset.last_error ||
        asset.lot_id !== fallback.lot_id ||
        Number(asset.sort_order) !== fallback.sort_order
      );
    }

      return Boolean(
        window.supabase &&
        SUPABASE_URL !== "YOUR_SUPABASE_URL" &&
        SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY"

    async function loadProductionStateFromSupabase() {
      const client = getProductionStateSupabaseClient();
      if (!client) return null;

      const { data, error } = await client
        .from(PRODUCTION_STATES_TABLE)
        .select('data, updated_at')
        .eq('project_key', PRODUCTION_STATE_PROJECT_KEY)
        .maybeSingle();

      if (error) throw error;
      if (!data || !hasProductionStateData(data.data)) return null;
      return {
        data: ensureProductionState(data.data),
        updatedAt: data.updated_at || null
      };
    }

    async function saveProductionStateToSupabase() {
      const client = getProductionStateSupabaseClient();
      if (!client) throw new Error("Supabase is not configured.");
      if (!hasProductionStateData(productionState)) {
        productionStateSyncPending = false;
        return;
      }

      const updatedAt = new Date().toISOString();
      const { error } = await client
        .from(PRODUCTION_STATES_TABLE)
        .upsert({
          project_key: PRODUCTION_STATE_PROJECT_KEY,
          data: ensureProductionState(productionState),
          updated_at: updatedAt
        }, { onConflict: 'project_key' });

      if (error) throw error;
      productionStateUpdatedAt = updatedAt;
      productionStateSyncPending = false;
    }

    function scheduleProductionStateSave() {
      productionStateSyncPending = true;
      clearTimeout(productionStateSaveTimer);
      productionStateSaveTimer = setTimeout(() => {
        saveProductionStateToSupabase().catch(e => {
          productionStateSyncPending = true;
          console.error("[wizard] production state cloud save failed:", e);
        });
      }, 1200);
    }

    async function hydrateProductionStateFromSupabase() {
      try {
        const cloudState = await loadProductionStateFromSupabase();
        if (cloudState) {
          if (productionStateDirty) return;
          productionState = cloudState.data;
          productionStateUpdatedAt = cloudState.updatedAt;
          productionStateHydrated = true;
          saveProductionState({ sync: false, markDirty: false });
          const currentStepId = getCurrentStepId();
          if (currentStepId >= 3 && currentStepId <= 7) {
            renderProductionWorkspace(currentStepId);
          }
          return;
        }

        productionStateHydrated = true;
        if (hasProductionStateData(productionState)) {
          await saveProductionStateToSupabase();
        }
      } catch (e) {
        productionStateHydrated = true;
        productionStateSyncPending = hasProductionStateData(productionState);
        console.error("[wizard] production state cloud load failed:", e);
      }
    }

    window.addEventListener('online', () => {
      if (productionStateSyncPending) {
        saveProductionStateToSupabase().catch(e => {
          productionStateSyncPending = true;
          console.error("[wizard] production state reconnect sync failed:", e);
        });
      }
    });

    const TOOL_LINK_STEP_TITLE_MIGRATIONS = {

    function migrateToolLinkStepIds(links) {
      if (Array.isArray(links)) return { links, changed: false };

      const migrated = {};
      let changed = false;

      Object.values(links || {}).forEach(stepLinks => {
        if (!stepLinks || !stepLinks.tools) return;

        const migration = TOOL_LINK_STEP_TITLE_MIGRATIONS[stepLinks.stepTitle];
        const stepId = migration ? migration.stepId : Number(stepLinks.stepId);
        const stepDef = STEPS.find(s => s.id === stepId);
        const stepTitle = migration ? migration.stepTitle : (stepLinks.stepTitle || (stepDef ? stepDef.title : "Unknown"));

        if (migration && Number(stepLinks.stepId) !== stepId) changed = true;
        if (!migrated[stepId]) {
          migrated[stepId] = { stepId, stepTitle, tools: {} };
        }

        Object.entries(stepLinks.tools).forEach(([media, tools]) => {
          if (!migrated[stepId].tools[media]) migrated[stepId].tools[media] = [];
          migrated[stepId].tools[media].push(...(tools || []));
        });
      });

      Object.values(migrated).forEach(stepLinks => {
        Object.values(stepLinks.tools || {}).forEach(tools => {
          tools.sort((a, b) => (a.order || 0) - (b.order || 0));
          tools.forEach((tool, index) => { tool.order = index; });
        });
      });

      return { links: changed ? migrated : links, changed };
    }

    function mapToolRowsToLinks(rows) {
      const links = {};
      (rows || []).forEach(row => {
        const stepId = Number(row.step_id);
        const media = row.media || 'other';
        const stepDef = STEPS.find(s => s.id === stepId);
        if (!links[stepId]) {
          links[stepId] = {
            stepId,
            stepTitle: row.step_title || (stepDef ? stepDef.title : "Unknown"),
            tools: {}
          };
        }
        if (!links[stepId].tools[media]) links[stepId].tools[media] = [];
        links[stepId].tools[media].push({
          id: row.id,
          name: row.name || '',
          url: row.url || '',
          category: row.category || '',
          note: row.note || '',
          order: Number.isFinite(Number(row.sort_order)) ? Number(row.sort_order) : links[stepId].tools[media].length,
          enabled: row.enabled !== false
        });
      });
      Object.values(links).forEach(stepLinks => {
        Object.values(stepLinks.tools || {}).forEach(tools => {
          tools.sort((a, b) => (a.order || 0) - (b.order || 0));
          tools.forEach((tool, index) => { tool.order = index; });
        });
      });
      return links;
    }

    async function loadToolLinksFromSupabase() {
      const client = getToolLinksSupabaseClient();
      if (!client) return null;

      const { data, error } = await client
        .from(TOOL_LINKS_TABLE)
        .select('id, step_id, step_title, media, name, url, category, note, sort_order, enabled')
        .eq('project_key', TOOL_LINKS_PROJECT_KEY)
        .order('step_id', { ascending: true })
        .order('media', { ascending: true })
        .order('sort_order', { ascending: true });

      if (error) throw error;
      if (!data || data.length === 0) return null;
      return mapToolRowsToLinks(data);
    }

    async function hydrateToolLinksFromSupabase() {
      try {
        const cloudLinks = await loadToolLinksFromSupabase();
        if (!cloudLinks) return;
        const migrated = migrateToolLinkStepIds(cloudLinks);
        localStorage.setItem(STORAGE_KEYS.TOOL_LINKS, JSON.stringify(migrated.links));
        state.allToolLinks = normalizeToolLinks(migrated.links);
        renderCurrentStepTools();
      } catch (e) {
        console.error("[wizard] tool links cloud load failed:", e);
        state.allToolLinks = loadToolLinksFromLocalStorage();
        renderCurrentStepTools();
      }
    }

    function normalizeToolLinks(links) {
      if (Array.isArray(links)) return links.filter(tool => tool.enabled !== false);
      return Object.values(links || {}).flatMap(stepLinks => {
        if (!stepLinks || !stepLinks.tools) return [];
        return Object.entries(stepLinks.tools).flatMap(([media, tools]) => {
          return (tools || []).filter(tool => tool.enabled !== false).map(tool => ({
            ...tool,
            stepId: stepLinks.stepId,
            media,
            description: tool.note || tool.description || "",
            allowedLevels: "all"
          }));
        });
      });
    }

    function clampPostingFrequency(value) {
      const number = Number(value);
      if (Number.isNaN(number)) return 3;
      return Math.min(7, Math.max(3, number));

    function getTodayToken() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}${month}${day}`;
    }

    function buildDefaultLotId() {
      return `lot_${getTodayToken()}_a`;
    }

    function normalizeStep4SortOrder(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 1;
      return Math.max(1, Math.floor(number));
    }

    function buildStep4VideoId(lotId, sortOrder) {
      const safeLotId = String(lotId || buildDefaultLotId())
        .trim()
        .replace(/[^a-zA-Z0-9_-]/g, "_") || buildDefaultLotId();
      return `${safeLotId}_video_${normalizeStep4SortOrder(sortOrder)}`;
    }

    function getStep4AssetStatusClass(asset) {
      if (!asset?.status) return '';

      if (asset.status === 'upload_failed' || asset.status === 'save_failed') return 'is-error';

      return '';
    }

    function getStep4AssetStatusText(asset) {

        saving: 'Supabaseへ保存中...',
        asset_uploaded: '保存済み',

    function validateStep4ImageFile(file) {
      if (!file) {
        throw new Error('画像ファイルを取得できませんでした。もう一度選択してください。');
      }
      if (!file.name) {
        throw new Error('画像ファイル名を取得できませんでした。');
      }
      if (file.type && !file.type.startsWith('image/')) {
        throw new Error('画像ファイルを選択してください。');
      }
    }

    function extractBase64FromDataUrl(dataUrl) {
      if (typeof dataUrl !== 'string' || dataUrl.length === 0) {
        throw new Error('画像データの読み込みに失敗しました。');
      }
      if (!dataUrl.includes(',')) {
        return dataUrl;
      }

      const base64 = dataUrl.split(',')[1];
      if (!base64) {
        throw new Error('画像データの読み込みに失敗しました。base64データが空です。');
      }
      return base64;
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          if (typeof dataUrl !== 'string') {
            reject(new Error('画像データの読み込みに失敗しました。'));
            return;
          }
          resolve(dataUrl);
        };
        reader.onerror = () => reject(reader.error || new Error('画像の読み込みに失敗しました。'));
        reader.readAsDataURL(file);
      });
    }

    async function readFileAsBase64(file) {
      const dataUrl = await readFileAsDataUrl(file);
      return extractBase64FromDataUrl(dataUrl);
    }

    async function uploadStep4AssetImage(file) {
      const asset = productionState.step4Asset || createDefaultStep4Asset();
      productionState.step4Asset = asset;
      syncStep4AssetVideoId(asset);

      asset.status = 'uploading';
      asset.last_error = '';
      saveProductionState();
      renderProductionWorkspace(getCurrentStepId());

      try {
        validateStep4ImageFile(file);
        if (productionUiState.step4PreviewUrl) URL.revokeObjectURL(productionUiState.step4PreviewUrl);
        productionUiState.step4PreviewUrl = URL.createObjectURL(file);
        renderProductionWorkspace(getCurrentStepId());

        const imageBase64 = await readFileAsBase64(file);
        const response = await fetch(GAS_IMAGE_UPLOAD_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            file_name: file.name,
            mime_type: file.type || 'application/octet-stream',
            image_base64: imageBase64,
            project_title: state.project,
            video_id: asset.video_id,
            lot_id: asset.lot_id,
            sort_order: asset.sort_order
          })
        });
        const responseText = await response.text();
        const parsed = parseGasJsonResponse(responseText);
        if (!response.ok) throw new Error(parsed?.message || `GAS upload failed: ${response.status}`);

        const normalized = normalizeGasUploadResponse(parsed);
        if (!normalized.success) throw new Error(normalized.message || 'GASアップロードに失敗しました。');
        if (!normalized.drive_file_id && !normalized.drive_url) {
          throw new Error('GASレスポンスからDrive情報を取得できませんでした。');
        }

        asset.drive_file_id = normalized.drive_file_id;
        asset.drive_url = normalized.drive_url || buildDriveUrlFromFileId(normalized.drive_file_id);
        asset.image_uploaded_at = new Date().toISOString();
        asset.status = 'uploaded_to_drive';
        asset.last_error = '';
      } catch (e) {
        asset.status = 'upload_failed';
        asset.last_error = e.message || '画像アップロードに失敗しました。';
        console.error('[wizard] step4 image upload failed:', e);
      }

      saveProductionState();
      renderProductionWorkspace(getCurrentStepId());
    }

    function parseGasJsonResponse(responseText) {
      try {
        return JSON.parse(responseText);
      } catch (e) {
        return { success: false, message: responseText || e.message };
      }
    }

    function normalizeGasUploadResponse(value) {
      const data = value?.data && typeof value.data === 'object' ? value.data : {};
      const driveUrl = value?.drive_url || value?.driveUrl || value?.url || value?.webViewLink || data.drive_url || data.driveUrl || data.url || data.webViewLink || '';
      const driveFileId = value?.drive_file_id || value?.driveFileId || value?.file_id || value?.fileId || value?.id || data.drive_file_id || data.driveFileId || data.file_id || data.fileId || data.id || extractDriveFileId(driveUrl);
      return {
        success: value?.success !== false && !value?.error,
        message: value?.message || value?.error || data.message || '',
        drive_file_id: String(driveFileId || ''),
        drive_url: String(driveUrl || '')
      };
    }

    function extractDriveFileId(url) {
      const text = String(url || '');
      const fileMatch = text.match(/\/d\/([^/]+)/);
      if (fileMatch) return fileMatch[1];
      const queryMatch = text.match(/[?&]id=([^&]+)/);
      return queryMatch ? decodeURIComponent(queryMatch[1]) : '';
    }

    function buildDriveUrlFromFileId(fileId) {
      return fileId ? `https://drive.google.com/file/d/${encodeURIComponent(fileId)}/view` : '';
    }

    async function saveStep4AssetToSupabase() {
      const asset = productionState.step4Asset || createDefaultStep4Asset();
      productionState.step4Asset = asset;
      syncStep4AssetVideoId(asset);

      if (!asset.drive_file_id && !asset.drive_url) {
        asset.status = 'save_failed';
        asset.last_error = '先に画像をアップロードしてください。';
        saveProductionState();
        renderProductionWorkspace(getCurrentStepId());
        return;
      }

      let assetJson = null;
      const jsonText = asset.asset_json_text.trim();
      if (jsonText) {
        try {
          assetJson = JSON.parse(jsonText);
        } catch (e) {
          asset.status = 'save_failed';
          asset.last_error = `JSONの構文エラー: ${e.message}`;
          saveProductionState();
          renderProductionWorkspace(getCurrentStepId());
          return;
        }
      } else {
        alert('JSON欄が空のため、asset_json は null で保存します。');
      }

      const client = getVideoAssetsSupabaseClient();
      if (!client) {
        asset.status = 'save_failed';
        asset.last_error = 'Supabaseが設定されていません。Drive URLは画面に残しています。';
        saveProductionState();
        renderProductionWorkspace(getCurrentStepId());
        return;
      }

      asset.status = 'saving';
      asset.last_error = '';
      saveProductionState();
      renderProductionWorkspace(getCurrentStepId());

      const payload = {
        project_title: state.project,
        video_id: asset.video_id,
        lot_id: asset.lot_id,
        sort_order: asset.sort_order,
        drive_file_id: asset.drive_file_id || null,
        drive_url: asset.drive_url || null,
        image_uploaded_at: asset.image_uploaded_at || new Date().toISOString(),
        asset_json: assetJson,
        script_raw: asset.script_raw || null,
        shot_count: getShotCount(assetJson),
        status: 'asset_uploaded'
      };

      try {
        const { error } = await client
          .from(VIDEO_ASSETS_TABLE)
          .upsert(payload, { onConflict: 'project_title,video_id' });
        if (error) throw error;

        asset.status = 'asset_uploaded';
        asset.last_error = '';
      } catch (e) {
        asset.status = 'save_failed';
        asset.last_error = e.message || 'Supabase保存に失敗しました。';
        console.error('[wizard] step4 asset save failed:', e);
      }

      saveProductionState();
      renderProductionWorkspace(getCurrentStepId());
    }

    function getShotCount(assetJson) {
      if (!assetJson || typeof assetJson !== 'object') return null;
      const direct = Number(assetJson.shot_count ?? assetJson.shotCount);
      if (Number.isFinite(direct)) return direct;
      if (Array.isArray(assetJson.shots)) return assetJson.shots.length;
      return null;
    }

    // ============================================================
    // Production Events
    // ============================================================
    function onProductionInput(event) {
      updateProductionValue(event.target);
    }

    function onProductionChange(event) {
      if (event.target.dataset.step4AssetFile !== undefined) {
        const file = event.target.files?.[0];
        if (file) {
          uploadStep4AssetImage(file);
          return;
        }
        const asset = productionState.step4Asset || createDefaultStep4Asset();
        productionState.step4Asset = asset;
        asset.status = 'upload_failed';
        asset.last_error = '画像ファイルを取得できませんでした。もう一度選択してください。';
        saveProductionState();
        renderProductionWorkspace(getCurrentStepId());
        return;
      }
      updateProductionValue(event.target);
      if (
        event.target.dataset.kind === 'step4-asset' &&
        (event.target.dataset.field === 'lot_id' || event.target.dataset.field === 'sort_order')
      ) {
        renderProductionWorkspace(getCurrentStepId());
      }
      if (event.target.dataset.productionField === 'postingFrequency') {
        saveProductionState();
      }
    }

    function onProductionClick(event) {
      const button = event.target.closest('button');
      if (!button) return;
      const action = button.dataset.action;
      if (!action) return;

      if (action === 'import-cut-batch') {
        importCutBatchFromInput();
      }
      if (action === 'save-step4-asset') {
        saveStep4AssetToSupabase();
      }
      if (action === 'copy-step4-drive-url') {
        copyText(productionState.step4Asset?.drive_url || '', button.nextElementSibling);
      }
      if (action === 'add-character') {
        productionState.characters.push(createCharacter(productionState.characters.length));
        saveProductionState();
        renderProductionWorkspace(getCurrentStepId());
      }
      if (action === 'delete-character') {
        const index = Number(button.dataset.characterIndex);
        if (confirm('このキャラ案を削除しますか？')) {
          productionState.characters.splice(index, 1);
          saveProductionState();
          renderProductionWorkspace(getCurrentStepId());
        }
      }
      if (action === 'select-video') {
        productionUiState.activeVideoByStep[button.dataset.stepId] = Number(button.dataset.videoIndex);
        renderProductionWorkspace(getCurrentStepId());
      }
      if (action === 'add-scene') {
        const videoIndex = Number(button.dataset.videoIndex);
        productionState.videos[videoIndex].scenes.push(createDefaultScene(videoIndex));
        saveProductionState();
        renderProductionWorkspace(getCurrentStepId());
      }
      if (action === 'delete-scene') {
        const videoIndex = Number(button.dataset.videoIndex);
        const sceneIndex = Number(button.dataset.sceneIndex);
        if (confirm('このシーンを削除しますか？')) {
          productionState.videos[videoIndex].scenes.splice(sceneIndex, 1);
          renumberScenes(videoIndex);
          saveProductionState();
          renderProductionWorkspace(getCurrentStepId());
        }
      }
      if (action === 'copy') {
        const text = getCopyText(button.dataset.copyType, Number(button.dataset.videoIndex), button.dataset.sceneIndex === undefined ? null : Number(button.dataset.sceneIndex));
        copyText(text, button.nextElementSibling);
      }
      if (action === 'copy-cut') {
        const copied = copyCutText(button.dataset.copyType, Number(button.dataset.videoIndex), Number(button.dataset.cutIndex), button.nextElementSibling);
        if (copied) saveProductionState();
      }
    }

    function updateProductionValue(target) {
      if (!target.dataset) return;

      if (target.dataset.productionField === 'postingFrequency') {
        productionState.postingFrequency = clampPostingFrequency(target.value);
        saveProductionState();
        return;
      }

      const kind = target.dataset.kind;
      const field = target.dataset.field;
      if (!kind || !field) return;
      const value = target.type === 'checkbox' ? target.checked : target.value;

      if (kind === 'character') {
        const character = productionState.characters[Number(target.dataset.characterIndex)];
        if (character) character[field] = value;
      }
      if (kind === 'step4-asset') {
        const asset = productionState.step4Asset || createDefaultStep4Asset();
        productionState.step4Asset = asset;
        if (field === 'sort_order') {
          asset[field] = normalizeStep4SortOrder(value);
        } else {
          asset[field] = String(value || '');
        }
        if (field === 'lot_id' || field === 'sort_order') syncStep4AssetVideoId(asset);
      }
      if (kind === 'video') {
        const video = productionState.videos[Number(target.dataset.videoIndex)];
        if (video && field !== 'video_id') video[field] = value;
      }
      if (kind === 'scene') {
        const video = productionState.videos[Number(target.dataset.videoIndex)];
        const scene = video?.scenes[Number(target.dataset.sceneIndex)];
        if (scene) scene[field] = value;
      }
      if (kind === 'cut-status') {
        const cut = getCut(Number(target.dataset.videoIndex), Number(target.dataset.cutIndex));
        if (cut && cut.status && field in cut.status) cut.status[field] = Boolean(value);
      }
      if (kind === 'cut-note') {
        const cut = getCut(Number(target.dataset.videoIndex), Number(target.dataset.cutIndex));
        if (cut && cut.notes && field in cut.notes) cut.notes[field] = String(value || '');
      }
      saveProductionState();
    }

    function getCurrentStepId() {
      return state.targetSteps[state.currentIndex]?.id;
    }

    function importCutBatchFromInput() {
      const input = els.productionWorkspace.querySelector('textarea[data-cut-batch-import]');
      if (!input) return;

      let parsed;
      try {
        parsed = JSON.parse(input.value);
      } catch (e) {
        alert(`JSONの読み込みに失敗しました。\n構文エラー: ${e.message}`);
        return;
      }

      const errors = validateCutBatchImport(parsed);
      if (errors.length > 0) {
        alert(`JSONの必須項目が不足しています。\n- ${errors.join('\n- ')}`);
        return;
      }

      if (hasCutBatchData() && !confirm('既存の6秒カットバッチを全置換します。続行しますか？')) return;

      productionState.cutBatch = normalizeCutBatch(parsed);
      saveProductionState();
      renderProductionWorkspace(getCurrentStepId());
    }

      return productionState.cutBatch?.videos?.[videoIndex]?.cuts?.[cutIndex] || null;
    }

    // ============================================================
    // Copy Helpers
    // ============================================================
    async function copyText(text, feedbackElement) {
      try {
        await navigator.clipboard.writeText(text || '');
        showCopyFeedback(feedbackElement, 'コピー済み', 'is-success');
      } catch (e) {
        showCopyFeedback(feedbackElement, 'コピーできませんでした。手動で選択してコピーしてください。', 'is-error');
      }
    }

    function showCopyFeedback(element, message, className) {
      if (!element) return;
      element.textContent = message;
      element.classList.remove('is-success', 'is-error');
      element.classList.add(className);
      setTimeout(() => {
        element.textContent = '';
        element.classList.remove(className);
      }, 2500);
    }

    function getCopyText(type, videoIndex, sceneIndex) {
      const video = productionState.videos[videoIndex];
      const scene = sceneIndex === null ? null : video?.scenes[sceneIndex];
      const map = {
        videoPrompt: buildVideoPrompt(video),
        fullDialogue: video?.full_dialogue || '',
        captionDialogue: video?.caption_dialogue || '',
        voiceDialogue: video?.voice_dialogue || '',
        sceneVideoPrompt: buildSceneVideoPrompt(scene),
        sceneDescription: scene?.scene_description_en || '',
        sceneDialogue: scene?.dialogue || '',
        sceneCaption: scene?.caption_dialogue || '',
        sceneVoice: scene?.voice_dialogue || scene?.dialogue || ''
      };
      return map[type] || '';
    }

    function copyCutText(type, videoIndex, cutIndex, feedbackElement) {
      const cut = getCut(videoIndex, cutIndex);
      if (!cut) return false;
      const map = {
        videoPrompt: cut.videoPrompt || '',
        voiceLine: cut.line || cut.caption || ''
      };
      const text = map[type] || '';
      copyText(text, feedbackElement);

      if (type === 'videoPrompt') {
        cut.status.videoPromptCopied = true;
        const checkbox = els.productionWorkspace.querySelector(`input[data-kind="cut-status"][data-field="videoPromptCopied"][data-video-index="${videoIndex}"][data-cut-index="${cutIndex}"]`);
        if (checkbox) checkbox.checked = true;
      }
      if (type === 'voiceLine') {
        cut.status.voiceCopied = true;
        const checkbox = els.productionWorkspace.querySelector(`input[data-kind="cut-status"][data-field="voiceCopied"][data-video-index="${videoIndex}"][data-cut-index="${cutIndex}"]`);
        if (checkbox) checkbox.checked = true;
      }

      return true;
    }

    function buildVideoPrompt(video) {
      if (!video) return '';
      const parts = [video.scene_description_en, video.visual_prompt].filter(Boolean);
      const dialogue = video.full_dialogue ? `Dialogue: ${video.full_dialogue}` : '';
      return [...parts, dialogue, 'high quality, 9:16'].filter(Boolean).join('\n');
    }

    function buildSceneVideoPrompt(scene) {
      if (!scene) return '';
      const parts = [scene.scene_description_en, scene.visual_prompt].filter(Boolean);
      const dialogue = scene.dialogue ? `Dialogue: ${scene.dialogue}` : '';
      return [...parts, dialogue, 'high quality, 9:16'].filter(Boolean).join('\n');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ============================================================
    // Logic & Flow
    // ============================================================
    function handleNextStep() {
      saveCurrentStepLog();

      if (state.currentIndex < state.targetSteps.length - 1) {
        state.currentIndex++;
        renderCurrentStep();
      } else {
        finishSession('completed');
      }
    }

    function handleAbort() {
      if (confirm('現在の作業を中断し、ここまでの記録を保存して終了しますか？')) {
        saveCurrentStepLog();
        finishSession('aborted');
      }
    }

    function saveCurrentStepLog() {
      const step = state.targetSteps[state.currentIndex];
      state.sessionLog.steps.push({
        stepId: step.id,
        stepTitle: step.title,
        startTime: state.currentStepStartTime,
        endTime: Date.now(),
        memo: els.stepMemo.value.trim()
      });
    }

    function finishSession(status) {
      console.log(`[wizard] Finishing session with status: ${status}`);
      state.sessionLog.status = status;
      state.sessionLog.endTime = Date.now();

      // Save to localStorage
      try {
        let sessions = [];
        const raw = localStorage.getItem(STORAGE_KEYS.SESSION);
        if (raw) sessions = JSON.parse(raw);
        
        sessions.push(state.sessionLog);
        localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(sessions));
      } catch (e) {
        console.error("[wizard] Failed to save session log:", e);
      }

      // 最後のプログレスバーを100%にする
      els.progressBar.style.width = `100%`;

      // 遷移前に少し待つ
      setTimeout(() => {
        window.location.href = 'log.html';
      }, 500);
    }

    // ============================================================
    // Modals
    // ============================================================
    function openBrandModal() {
      els.modalBrand.classList.add('is-open');
    }
    function closeBrandModal() {
      els.modalBrand.classList.remove('is-open');
    }
    
    // Close modal when clicking outside
    els.modalBrand.addEventListener('click', (e) => {
      if (e.target === els.modalBrand) closeBrandModal();
    });

    // Start
    init();
  </script>
</body>
</html>
